name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: bash scripts/make-app.sh "${{ steps.ver.outputs.version }}"

      - name: Create DMG
        run: bash scripts/create-dmg.sh "${{ steps.ver.outputs.version }}"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vimkin-${{ steps.ver.outputs.version }}.dmg
            dist/vimkin-${{ steps.ver.outputs.version }}.dmg.sha256
          generate_release_notes: true
